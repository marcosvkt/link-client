<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<!--HEAD-->

<script>const CONFIG = __CONFIG_JSON__;</script>

<style>
:root{
  --pri:#F28C28; --dark:#3A1D0E; --light:#FFF7EE;
  --ink:#2a1a10; --muted:#7a6656; --radius:18px;
  --shadow:0 10px 30px rgba(40,20,5,.18);
  --ft:"Playfair Display",Georgia,serif; --fb:Inter,system-ui,sans-serif; --btnr:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--light);color:var(--ink);line-height:1.5;overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--ft);line-height:1.1}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--pri)}

/* Botões */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:var(--btnr);font-weight:700;font-size:.92rem;
  background:var(--pri);color:#fff;border:0;cursor:pointer;transition:transform .2s,box-shadow .2s,filter .2s;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.25);filter:brightness(1.05)}
.btn.ghost{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.5);backdrop-filter:blur(6px)}
.btn.outline{background:transparent;color:var(--ink);border:1.5px solid #e2cdb8}
.btn.outline:hover{border-color:var(--pri);color:var(--pri)}
.btn svg{width:18px;height:18px;flex:none}
.pulse{animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pri) 60%,transparent)}70%{box-shadow:0 0 0 16px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* Topo */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.solid{background:var(--dark);box-shadow:0 4px 20px rgba(0,0,0,.25)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-family:var(--ft);font-size:1.3rem;font-weight:800}
.brand img{height:44px;width:auto}
header .btn{padding:9px 16px;font-size:.82rem}

/* Status aberto/fechado */
.status{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;font-size:.82rem;font-weight:600;
  background:rgba(0,0,0,.35);color:#fff;backdrop-filter:blur(6px)}
.status i{width:9px;height:9px;border-radius:50%;background:#e74c3c}
.status.open i{background:#2ecc71;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}

/* Hero */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden;padding:120px 0 70px}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.12);animation:kenburns 18s ease-in-out infinite alternate}
@keyframes kenburns{to{transform:scale(1) translate(-1.5%,-1%)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,.35) 40%,var(--dark) 100%)}
.hero .wrap{position:relative;z-index:2;width:100%}
.hero h1{font-size:clamp(2.4rem,7vw,4.6rem);margin:16px 0 12px;max-width:14ch}
.hero p.lead{font-size:clamp(1rem,2.4vw,1.25rem);max-width:520px;opacity:.92;margin-bottom:26px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px}
.hero .in{opacity:0;transform:translateY(24px);animation:up .9s cubic-bezier(.2,.7,.2,1) forwards}
.hero .in:nth-child(2){animation-delay:.15s}.hero .in:nth-child(3){animation-delay:.3s}.hero .in:nth-child(4){animation-delay:.45s}
@keyframes up{to{opacity:1;transform:none}}
.scrollhint{position:absolute;left:50%;bottom:18px;z-index:2;width:24px;height:38px;border:2px solid rgba(255,255,255,.6);border-radius:14px;transform:translateX(-50%)}
.scrollhint::before{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s infinite}
@keyframes wheel{to{transform:translateY(12px);opacity:0}}

/* Faixa de promoção */
.promo{background:var(--pri);color:#fff;overflow:hidden;white-space:nowrap;font-weight:600;font-size:.95rem}
.promo .track{display:inline-flex;gap:60px;padding:12px 0;animation:marquee 22s linear infinite}
@keyframes marquee{to{transform:translateX(-50%)}}

/* Seções */
section{padding:72px 0}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-size:clamp(1.9rem,4.5vw,2.8rem);margin-top:6px}
.sec-head p{color:var(--muted);margin-top:8px}

/* Cartões principais (estilo Garagem) */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{position:relative;min-height:260px;border-radius:var(--radius);overflow:hidden;color:#fff;display:flex;align-items:flex-end;box-shadow:var(--shadow);border-bottom:4px solid var(--pri)}
.card .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.8))}
.card:hover .bg{transform:scale(1.08)}
.card .body{position:relative;z-index:2;padding:22px}
.card h3{font-size:1.9rem;margin:2px 0 6px}
.card p{font-size:.9rem;opacity:.9;margin-bottom:14px}

/* Destaques */
.dishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.dish{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 16px rgba(60,30,10,.08);transition:transform .3s,box-shadow .3s}
.dish:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.dish .ph{aspect-ratio:4/3;overflow:hidden}
.dish .ph img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.dish:hover .ph img{transform:scale(1.07)}
.dish .tx{padding:16px 18px 20px}
.dish h3{font-size:1.25rem}
.dish p{color:var(--muted);font-size:.9rem;margin:4px 0 10px}
.dish .price{font-weight:800;color:var(--pri);font-size:1.1rem}

/* Unidades */
.unit{display:grid;grid-template-columns:1fr 1.2fr;gap:0;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:24px}
.unit .info{padding:28px}
.unit h3{font-size:1.7rem;margin-bottom:6px}
.unit .addr{color:var(--muted);margin-bottom:14px;display:flex;gap:8px}
.unit .addr svg{width:18px;flex:none;color:var(--pri);margin-top:3px}
.hours{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:18px}
.hours td{padding:5px 0;border-bottom:1px dashed #eadccf}
.hours td:last-child{text-align:right;font-weight:600}
.hours tr.today td{color:var(--pri);font-weight:700}
.unit .actions{display:flex;flex-wrap:wrap;gap:8px}
.unit .actions .btn{padding:9px 14px;font-size:.82rem}
.unit iframe{width:100%;height:100%;min-height:340px;border:0;display:block}

/* Links rápidos (estilo linktree) */
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;max-width:820px;margin:0 auto}
.link{display:flex;align-items:center;gap:14px;background:#fff;padding:16px 18px;border-radius:14px;border:1.5px solid #f0e2d3;font-weight:600;transition:border-color .2s,transform .2s}
.link:hover{border-color:var(--pri);transform:translateX(4px)}
.link .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 14%,#fff);color:var(--pri);flex:none}
.link .ic svg{width:22px;height:22px}
.link > svg{width:20px;height:20px;flex:none;color:var(--muted)}
.card .bg,.hero .bg,.dish .ph{background-color:color-mix(in srgb,var(--pri) 35%,var(--dark))}
.link small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}

/* Extras: cupom e wifi */
.extras{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;max-width:820px;margin:28px auto 0}
.extra{background:var(--dark);color:#fff;border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.extra::before{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:var(--pri);opacity:.25}
.extra .code{display:inline-block;margin-top:10px;padding:8px 14px;border:2px dashed var(--pri);border-radius:10px;font-family:monospace;font-size:1.1rem;font-weight:700;cursor:pointer;letter-spacing:.05em}
.extra small{display:block;opacity:.7;margin-top:6px;font-size:.78rem}

/* Rodapé */
footer{background:var(--dark);color:#e9dccf;padding:48px 0 28px;text-align:center}
footer .brand{justify-content:center;margin-bottom:16px}
.social{display:flex;justify-content:center;gap:14px;margin-bottom:22px}
.social a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:1.5px solid rgba(255,255,255,.25);transition:background .2s,border-color .2s}
.social a:hover{background:var(--pri);border-color:var(--pri)}
.social svg{width:20px;height:20px}
footer .small{font-size:.8rem;opacity:.7;margin-top:6px}
footer .cred{color:var(--pri);font-size:.8rem;margin-top:16px}

/* WhatsApp flutuante */
.wa-float{position:fixed;right:18px;bottom:18px;z-index:60;width:60px;height:60px;border-radius:50%;background:#25D366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:float 3s ease-in-out infinite}
.wa-float svg{width:32px;height:32px}
@keyframes float{50%{transform:translateY(-6px)}}

/* Animação ao rolar */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.show{opacity:1;transform:none}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:10px 18px;border-radius:999px;font-size:.88rem;opacity:0;transition:.3s;z-index:70;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:760px){
  .unit{grid-template-columns:1fr}
  .unit iframe{min-height:260px}
  header .status{display:none}
  section{padding:56px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal,.hero .in{opacity:1;transform:none}}
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <a href="#" class="brand" id="brand"></a>
    <span class="status" id="statusTop"><i></i><span></span></span>
    <a class="btn" id="btnTopo">Fazer pedido</a>
  </div>
</header>

<section class="hero">
  <div class="bg" id="heroBg"></div>
  <div class="wrap">
    <span class="status in" id="statusHero"><i></i><span></span></span>
    <h1 class="in" id="heroTitle"></h1>
    <p class="lead in" id="heroLead"></p>
    <div class="ctas in" id="heroCtas"></div>
  </div>
  <div class="scrollhint"></div>
</section>

<div class="promo" id="promo" hidden><div class="track" id="promoTrack"></div></div>

<section id="inicio">
  <div class="wrap">
    <div class="cards" id="cards"></div>
  </div>
</section>

<section id="destaques" style="padding-top:0">
  <div class="wrap">
    <div class="sec-head reveal"><span class="eyebrow">Mais pedidos</span><h2>Destaques da casa</h2><p>Os favoritos dos nossos clientes.</p></div>
    <div class="dishes" id="dishes"></div>
  </div>
</section>

<section id="unidades" style="background:#fff5ea">
  <div class="wrap">
    <div class="sec-head reveal"><span class="eyebrow">Venha nos visitar</span><h2>Onde estamos</h2></div>
    <div id="units"></div>
  </div>
</section>

<section id="links">
  <div class="wrap">
    <div class="sec-head reveal"><span class="eyebrow">Tudo em um lugar</span><h2>Links rápidos</h2></div>
    <div class="links" id="linkList"></div>
    <div class="extras" id="extras"></div>
  </div>
</section>

<footer>
  <div class="wrap">
    <a href="#" class="brand" id="brandFoot"></a>
    <div class="social" id="social"></div>
    <div id="footInfo"></div>
    <div class="cred" id="cred"></div>
  </div>
</footer>

<a class="wa-float" id="waFloat" aria-label="Falar no WhatsApp" target="_blank" rel="noopener"></a>
<div class="toast" id="toast"></div>

<script>
(function(){
const C = CONFIG;
const $ = id => document.getElementById(id);
const DIAS = ["Domingo","Segunda","Terça","Quarta","Quinta","Sexta","Sábado"];

/* Ícones */
const I = {
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>',
  bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2V5Z"/><path d="M4 19a2 2 0 0 1 2-2h13"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.5"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="m12 2.5 2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9L12 2.5Z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  job:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  nav:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-8-8 18-2-8-8-2Z"/></svg>',
  car:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 17h14v-5l-2-5H7l-2 5v5Z"/><circle cx="8" cy="17" r="2"/><circle cx="16" cy="17" r="2"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

/* Cores e título */
const r = document.documentElement.style;
r.setProperty("--pri", C.corPrincipal); r.setProperty("--dark", C.corFundo); r.setProperty("--light", C.corClara);
const FT = C.fonteTitulo || "Playfair Display", FB = C.fonteTexto || "Inter";
r.setProperty("--ft", `"${FT}",Georgia,serif`); r.setProperty("--fb", `"${FB}",system-ui,sans-serif`);
r.setProperty("--btnr", {redondo:"999px", suave:"12px", quadrado:"4px"}[C.estiloBotao] || "999px");
const SINGLE=["Bebas Neue","Lobster","Pacifico","Abril Fatface","Righteous","Archivo Black","Alfa Slab One","Anton","Lilita One","Bangers","Permanent Marker","Yeseva One"];
if(!document.getElementById("gfonts")){
  const fl = document.createElement("link"); fl.id="gfonts"; fl.rel="stylesheet";
  fl.href = "https://fonts.googleapis.com/css2?" + [...new Set([FT,FB])].map(f=>"family="+f.replace(/ /g,"+")+(SINGLE.includes(f)?"":":wght@400;700")).join("&") + "&display=swap";
  document.head.appendChild(fl);
}
if(!document.title) document.title = C.nome + " – " + C.slogan;
C.delivery = C.delivery || []; C.destaques = C.destaques || [];
C.unidades = (C.unidades && C.unidades.length) ? C.unidades : [{nome:"Unidade", endereco:"", horarios:{}}];
if(!C.destaques.length) $("destaques").hidden = true;

/* Links */
const utm = url => { if(!url || !C.utm || !/^https?:/.test(url) || /wa\.me|google\.com\/maps|waze|uber|g\.page/.test(url)) return url;
  return url + (url.includes("?") ? "&" : "?") + C.utm; };
const waLink = (msg) => "https://wa.me/" + C.whatsapp + "?text=" + encodeURIComponent(msg || C.mensagemWhatsapp);
const pedido = C.delivery.length ? utm(C.delivery[0].link) : waLink();
const ext = 'target="_blank" rel="noopener"';

/* Marca */
const brandHTML = C.logo ? `<img src="${C.logo}" alt="${C.nome}">` : C.nome;
$("brand").innerHTML = brandHTML; $("brandFoot").innerHTML = brandHTML;
$("btnTopo").href = pedido; $("btnTopo").target="_blank";
$("btnTopo").innerHTML = I.bag + "Fazer pedido";

/* Horário: aberto/fechado */
function nowInTZ(){
  const p = Object.fromEntries(new Intl.DateTimeFormat("en-US",{timeZone:C.fusoHorario,weekday:"short",hour:"2-digit",minute:"2-digit",hourCycle:"h23"})
    .formatToParts(new Date()).map(x=>[x.type,x.value]));
  return { day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(p.weekday), min:(+p.hour)*60 + (+p.minute) };
}
const toMin = s => { const [h,m] = s.split(":").map(Number); return h*60+m; };
const span = s => { if(!s) return null; const [a,b] = s.split("-"); let o=toMin(a), c=toMin(b); if(c<=o) c+=1440; return [o,c]; };
const fmt = s => s.replace(/:00/g,"h").replace(/:(\d\d)/g,"h$1");
function status(h){
  const {day,min} = nowInTZ();
  const today = span(h[day]), yest = span(h[(day+6)%7]);
  if(yest && min + 1440 < yest[1]) return {open:true, txt:"Aberto agora · fecha às " + fmt(h[(day+6)%7].split("-")[1])};
  if(today && min >= today[0] && min < today[1]) return {open:true, txt:"Aberto agora · fecha às " + fmt(h[day].split("-")[1])};
  if(today && min < today[0]) return {open:false, txt:"Fechado · abre hoje às " + fmt(h[day].split("-")[0])};
  for(let i=1;i<=7;i++){ const d=(day+i)%7; if(h[d]) return {open:false, txt:"Fechado · abre " + (i===1?"amanhã":DIAS[d].toLowerCase()) + " às " + fmt(h[d].split("-")[0])}; }
  return {open:false, txt:"Fechado"};
}
function paintStatus(){
  const s = status(C.unidades[0].horarios);
  ["statusTop","statusHero"].forEach(id=>{ const el=$(id); el.classList.toggle("open",s.open); el.querySelector("span").textContent=s.txt; });
}
paintStatus(); setInterval(paintStatus, 60000);

/* Hero */
$("heroBg").style.backgroundImage = `url('${C.fotoCapa}')`;
$("heroTitle").textContent = C.nome;
$("heroLead").textContent = C.slogan;
$("heroCtas").innerHTML =
  `<a class="btn pulse" href="${pedido}" ${ext}>${I.bag}Pedir delivery</a>
   <a class="btn ghost" href="${utm(C.cardapio)}" ${ext}>${I.book}Ver cardápio</a>
   <a class="btn ghost" href="#unidades">${I.pin}Como chegar</a>`;

/* Faixa de promoção */
if(C.promocao){ $("promo").hidden=false; const t=("★ "+C.promocao+" ").repeat(4); $("promoTrack").innerHTML=`<span>${t}</span><span>${t}</span>`; }

/* Cartões principais */
const u0 = C.unidades[0];
const reservaLink = C.reserva || waLink("Olá! Gostaria de reservar uma mesa para __ pessoas no dia __ às __h.");
const cards = [
  {eye:"Peça pelo nosso", t:"Delivery", p:"Sinta a melhor experiência sem sair de casa.", btn:"Peça seu pedido", ic:I.bag, link:pedido, foto:C.destaques[0]?.foto||C.fotoCapa},
  {eye:"Confira nosso", t:"Cardápio", p:"Alguns itens podem variar. Confirme com nossos atendentes.", btn:"Ver cardápio", ic:I.book, link:utm(C.cardapio), foto:C.destaques[1]?.foto||C.fotoCapa},
  {eye:"Visite nosso", t:"Restaurante", p:resumoHorario(u0.horarios), btn:u0.nome, ic:I.pin, link:"#unidades", foto:u0.foto||C.fotoCapa, interno:true},
  {eye:"Garanta sua", t:"Reserva", p:"Aniversário, encontro ou família reunida: reserve sua mesa.", btn:"Reservar mesa", ic:I.cal, link:reservaLink, foto:C.fotoCapa}
];
$("cards").innerHTML = cards.map((c,i)=>`
  <a class="card reveal" style="transition-delay:${i*90}ms" href="${c.link}" ${c.interno?"":ext}>
    <div class="bg" style="background-image:url('${c.foto}')"></div>
    <div class="body"><span class="eyebrow">${c.eye}</span><h3>${c.t}</h3><p>${c.p}</p><span class="btn">${c.ic}${c.btn}</span></div>
  </a>`).join("");

function resumoHorario(h){
  const abertos = Object.keys(h).filter(d=>h[d]).map(Number);
  const fechados = [0,1,2,3,4,5,6].filter(d=>!h[d]).map(d=>DIAS[d]);
  return "Aberto " + abertos.length + " dias por semana." + (fechados.length ? " Folga: " + fechados.join(", ") + "." : "");
}

/* Destaques */
$("dishes").innerHTML = C.destaques.map((d,i)=>`
  <article class="dish reveal" style="transition-delay:${i*100}ms">
    <div class="ph"><img src="${d.foto}" alt="${d.nome}" loading="lazy"></div>
    <div class="tx"><h3>${d.nome}</h3><p>${d.descricao}</p><span class="price">${d.preco}</span></div>
  </article>`).join("");

/* Unidades */
const today = nowInTZ().day;
$("units").innerHTML = C.unidades.map(u=>{
  const q = encodeURIComponent(u.endereco);
  const rows = [1,2,3,4,5,6,0].map(d=>`<tr class="${d===today?"today":""}"><td>${DIAS[d]}</td><td>${u.horarios[d]?fmt(u.horarios[d]).replace("-"," às "):"Fechado"}</td></tr>`).join("");
  return `<div class="unit reveal">
    <div class="info">
      <span class="eyebrow">Unidade</span><h3>${u.nome}</h3>
      <p class="addr">${I.pin}<span>${u.endereco}</span></p>
      <table class="hours">${rows}</table>
      <div class="actions">
        <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${q}" ${ext}>${I.pin}Google Maps</a>
        <a class="btn outline" href="https://waze.com/ul?q=${q}&navigate=yes" ${ext}>${I.nav}Waze</a>
        <a class="btn outline" href="https://m.uber.com/ul/?action=setPickup&pickup=my_location&dropoff[formatted_address]=${q}" ${ext}>${I.car}Uber</a>
        <a class="btn outline" href="tel:+${C.whatsapp}">${I.phone}Ligar</a>
      </div>
    </div>
    <iframe loading="lazy" title="Mapa ${u.nome}" src="https://www.google.com/maps?q=${q}&output=embed"></iframe>
  </div>`;
}).join("");

/* Links rápidos */
const links = [
  {ic:I.wa, t:"Falar no WhatsApp", s:"Pedidos, dúvidas e encomendas", l:waLink()},
  ...C.delivery.map(d=>({ic:I.bag, t:d.nome, s:"Delivery", l:utm(d.link)})),
  {ic:I.book, t:"Cardápio completo", s:"Pratos, bebidas e sobremesas", l:utm(C.cardapio)},
  {ic:I.cal, t:"Reservar mesa", s:"Garanta seu lugar", l:reservaLink},
  {ic:I.star, t:"Avalie no Google", s:"Sua opinião nos ajuda muito", l:C.avaliarGoogle},
  {ic:I.ig, t:"Instagram", s:"Novidades e promoções", l:C.instagram},
  {ic:I.job, t:"Trabalhe conosco", s:"Envie seu currículo", l:C.trabalheConosco}
].filter(x=>x.l);
$("linkList").innerHTML = links.map((x,i)=>`
  <a class="link reveal" style="transition-delay:${i*60}ms" href="${x.l}" ${ext}>
    <span class="ic">${x.ic}</span><span style="flex:1">${x.t}<small>${x.s}</small></span>${I.arrow}
  </a>`).join("");

/* Cupom e Wi-Fi */
let ex = "";
if(C.cupom) ex += `<div class="extra reveal"><span class="eyebrow">Cupom</span><h3 style="margin-top:4px">${C.cupom.texto}</h3>
  <span class="code" data-copy="${C.cupom.codigo}">${C.cupom.codigo}</span><small>Toque no código para copiar</small></div>`;
if(C.wifi) ex += `<div class="extra reveal"><span class="eyebrow">Wi-Fi do salão</span><h3 style="margin-top:4px">${C.wifi.rede}</h3>
  <span class="code" data-copy="${C.wifi.senha}">${C.wifi.senha}</span><small>Toque na senha para copiar</small></div>`;
$("extras").innerHTML = ex;
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-copy]"); if(!el) return;
  navigator.clipboard?.writeText(el.dataset.copy).then(()=>toast("Copiado: " + el.dataset.copy)).catch(()=>toast(el.dataset.copy));
});
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

/* Rodapé */
$("social").innerHTML = `<a href="${waLink()}" ${ext} aria-label="WhatsApp">${I.wa}</a><a href="${C.instagram}" ${ext} aria-label="Instagram">${I.ig}</a>`;
$("footInfo").innerHTML = `<p>${C.unidades.map(u=>u.endereco).join(" · ")}</p><p class="small">Contato: ${C.telefone}</p>
  <p class="small">© ${new Date().getFullYear()} ${C.nome}. Todos os direitos reservados.</p>`;
$("cred").textContent = C.creditos || "";

/* WhatsApp flutuante */
$("waFloat").href = waLink(); $("waFloat").innerHTML = I.wa;

/* Topo sólido ao rolar */
const hdr = document.querySelector("header");
const onScroll = () => hdr.classList.toggle("solid", scrollY > 40);
addEventListener("scroll", onScroll, {passive:true}); onScroll();

/* Animação ao rolar */
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("show"); io.unobserve(e.target);} }),{threshold:.12});
document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
})();
</script>
</body>
</html>
